<!doctype html>

<head>

<a href="#/" data-nav="home" class="nav-link"><span class="nav-symbol">家</span> ホーム</a>
<a href="#/trending/music" data-nav="music" class="nav-link"><span class="nav-symbol">音</span> 音楽</a>
